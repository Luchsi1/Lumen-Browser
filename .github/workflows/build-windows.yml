name: Build Windows installer

on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Download filter lists to bundle
        run: node --experimental-strip-types scripts/fetch-lists.mjs
        continue-on-error: true
      - name: Show bundled lists
        run: Get-ChildItem resources/filterlists | Select-Object Name, Length
        continue-on-error: true
      - name: Build app
        run: npm run build
      - name: Package (NSIS installer and portable exe)
        run: npx electron-builder --win nsis portable zip --x64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: Lumen-windows
          path: |
            release/*.exe
            release/*.zip
            release/*.blockmap
          if-no-files-found: error
